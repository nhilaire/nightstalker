appId: io.github.nhilaire.nightstalker
name: Telemetry - accept consent, play and quit one run (events checked in logcat by verify.mjs)
tags:
  - telemetry
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "consent-screen"
    timeout: 30000
- tapOn:
    id: "consent-accept"
- assertVisible:
    id: "home-screen"
- tapOn:
    id: "home-play"
- assertVisible:
    id: "game-screen"
- extendedWaitUntil:
    visible: "NOT-A-REAL-TEXT"
    timeout: 3000
    optional: true
- tapOn:
    id: "game-pause"
- tapOn:
    id: "pause-quit"
- assertVisible:
    id: "game-over-screen"
- takeScreenshot: telemetry-game-over
