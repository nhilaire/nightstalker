appId: io.github.nhilaire.nightstalker
name: Scores - finished runs are saved and survive a restart
tags:
  - smoke
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "consent-screen"
    timeout: 30000
- tapOn:
    id: "consent-refuse"
- tapOn:
    id: "home-play"
- tapOn:
    id: "game-pause"
- tapOn:
    id: "pause-quit"
- assertVisible:
    id: "game-over-screen"
- tapOn:
    id: "gameover-menu"
- assertVisible:
    id: "home-best"
# AC-37: after a restart the saved run is still there, so the next game over lists 2 runs.
- stopApp
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
- assertVisible: "000000"
- tapOn:
    id: "home-play"
- tapOn:
    id: "game-pause"
- tapOn:
    id: "pause-quit"
- assertVisible: "1\\."
- assertVisible: "2\\."
- takeScreenshot: 04-scores-after-restart
