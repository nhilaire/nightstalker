appId: io.github.nhilaire.nightstalker
name: Language - switch from the settings, the whole UI follows at once and the choice survives a restart
tags:
  - language
---
- launchApp:
    clearState: true
- tapOn:
    id: "consent-refuse"
- tapOn:
    id: "home-settings"
- tapOn:
    id: "settings-language-fr"
- assertVisible: "Paramètres"
- takeScreenshot: language-fr-settings
- tapOn:
    id: "settings-language-en"
- assertVisible: "Settings"
- takeScreenshot: language-en-settings
- tapOn:
    id: "settings-back"
- assertVisible: "Play"
- takeScreenshot: language-en-home
- stopApp
- launchApp:
    stopApp: false
- assertVisible: "Play"
- tapOn:
    id: "home-settings"
- tapOn:
    id: "settings-language-auto"
- tapOn:
    id: "settings-language-fr"
- tapOn:
    id: "settings-back"
- assertVisible: "Jouer"
